
name: Build Test Publish Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build demo
        run: echo "Build completed"

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Test demo
        run: echo "Tests passed"

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Publish demo
        run: echo "Demo published"
